[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popal"
version = "0.6.0"
description = "POPAL — Personal AI Computer Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "POPAL Contributors"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
voice = [
    "sounddevice>=0.4",
    "numpy>=1.24",
    "faster-whisper>=1.0",
    "pyttsx3>=2.90",
    "openwakeword>=0.4",
    "onnxruntime>=1.16",
    "pynput>=1.7",
    "mss>=9.0",
]

[project.scripts]
popal = "popal.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]