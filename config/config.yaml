popal:
  name: "POPAL"
  environment: "development"
  log_level: "INFO"

platform:
  auto_detect: true

safety:
  confirmation_required: true
  emergency_stop_enabled: true

logging:
  enabled: true
  directory: "data/logs"

voice:
  enabled: false
  sample_rate: 16000
  activation_mode: "push_to_talk"   # "push_to_talk" or "wake_word"

  microphone:
    device_index: null              # null = system default
    buffer_seconds: 10

  vad:
    provider: "silero"              # "silero" or "energy"
    threshold: 0.5

  stt:
    provider: "faster_whisper"      # "faster_whisper" (local/offline)
    model_size: "base"              # "tiny", "base", "small", "medium", "large-v3"
    device: "cpu"
    compute_type: "int8"
    language: "en"

  wake_word:
    enabled: false                  # experimental — no custom "hey popal" model
    provider: "openwakeword"
    model_name: "hey_jarvis"
    threshold: 0.5

  tts:
    provider: "pyttsx3"
    muted: false
    volume: 1.0
    rate: 175

  timeouts:
    max_listen_seconds: 10
    silence_timeout_seconds: 2
    min_audio_seconds: 0.5

  privacy:
    save_recordings: false
    recording_directory: "data/recordings"

  command_aliases:
    vs code: "code"
    vscode: "code"
    visual studio code: "code"
    chrome: "google-chrome"
    google chrome: "google-chrome"

computer:
  provider: "auto"              # "auto", "linux", "windows"
  screenshot:
    save_to_disk: false         # privacy: screenshots stay in memory by default
  input_lock:
    timeout_seconds: 5

ai:
  enabled: false                # AI brain disabled by default
  provider: "local"             # "local" (deterministic), or future: "openai", "anthropic", "ollama"
  model: ""
  temperature: 0.0
  max_tokens: 2048
  timeout_seconds: 30
  max_plan_steps: 10
  max_context_messages: 10
  max_context_chars: 12000

vision:
  enabled: false                # disabled by default — privacy-first
  min_confidence: 0.85
  max_candidates: 5
  max_image_width: 3840
  max_image_height: 2160
  save_screenshots: false       # never save by default
  allow_external_processing: false  # no cloud processing by default

gestures:
  enabled: false                # disabled by default — privacy-first
  camera_index: 0
  max_camera_width: 640
  max_camera_height: 480
  target_fps: 20
  min_confidence: 0.85
  confirmation_frames: 3
  cooldown_ms: 500
  save_frames: false
  allow_external_processing: false
  pointer:
    enabled: false
    hand: "right"
    smoothing: 0.5
    deadzone: 0.02
  actions:
    pinch_click: false
  mappings:
    OPEN_PALM: emergency_stop
    PINCH: mouse_click
    POINT: pointer_move
    THUMBS_UP: confirm